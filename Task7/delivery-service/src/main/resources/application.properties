server.port=${DELIVERY_SERVICE_PORT:8080}
spring.application.name=practice7-delivery-service
# R2DBC — реактивная БД H2, встроенная в процесс. Данные обновляются после каждого нового запуска.
spring.r2dbc.url=${R2DBC_URL:r2dbc:h2:mem:///deliveries;DB_CLOSE_DELAY=-1}
spring.r2dbc.username=${R2DBC_USER:sa}
spring.r2dbc.password=${R2DBC_PASSWORD:}
spring.sql.init.mode=always
app.order-service-url=${ORDER_SERVICE_URL:http://localhost:8081}
